document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

late3d(0,0,0) rotate(0deg); } to { transform: translate3d(0,-18px,0) rotate(3deg); } }\n\n  button, a, select, input, img, [data-glow] {\n    transition: box-shadow .22s ease, transform .22s ease, background-color .22s ease, color .22s ease, border-color .22s ease, filter .22s ease;\n  }\n  button:hover, a:hover, [data-glow]:hover {\n    box-shadow: 0 0 0 1px rgba(250,208,40,0.85), 0 0 20px rgba(250,208,40,0.42);\n    transform: translateY(-1px);\n  }\n  button:active, [data-glow]:active { transform: translateY(0) scale(0.99); }\n  select:hover, input:hover, textarea:hover { box-shadow: 0 0 14px rgba(250,208,40,0.25); }\n  img[alt=\"Helal\"]:hover { filter: drop-shadow(0 0 12px rgba(250,208,40,0.85)); transform: scale(1.06); }\n  @media (prefers-reduced-motion: reduce) {\n    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div dir=\"ltr\" style=\"min-height: 100vh; background: #0d0d0d; color: #ffffff; display: flex; align-items: stretch;\">\n\n  <aside style=\"width: 268px; flex: 0 0 268px; background: #0d0d0d; color: #ffffff; padding: 26px 20px; display: flex; flex-direction: column; gap: 26px; overflow: hidden; border-right: 1px solid rgba(250,208,40,0.35);\">\n    <div style=\"display: flex; align-items: center; gap: 12px;\">\n      <img src=\"e2a20c48-5b5b-4620-a997-e58cad642428\" alt=\"Helal\" style=\"height: 36px; width: auto;\">\n      <div>\n        <div style=\"font: 700 17px Poppins, sans-serif; letter-spacing: 0.02em;\">HELAL HIRING<\u002Fdiv>\n        <div style=\"font: 400 12px Poppins, sans-serif; color: rgba(255,255,255,0.55); margin-top: 2px;\">Jobs &amp; internships<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <nav style=\"display: flex; flex-direction: column; gap: 4px;\">\n      <sc-for list=\"{{ nav }}\" as=\"item\" hint-placeholder-count=\"5\">\n        <button type=\"button\" sc-camel-on-click=\"{{ item.go }}\" style=\"{{ item.style }}\">\n          <span style=\"display: flex; flex-direction: column; align-items: flex-start; gap: 2px;\">\n            <span style=\"font: 600 15px Poppins, sans-serif;\">{{ item.label }}<\u002Fspan>\n            <span style=\"font: 500 10px Poppins, sans-serif; letter-spacing: 0.12em; opacity: 0.6;\">{{ item.en }}<\u002Fspan>\n          <\u002Fspan>\n          <span style=\"font: 600 13px Poppins, sans-serif; opacity: 0.75;\">{{ item.count }}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fnav>\n\n    <div style=\"margin-top: auto; display: flex; flex-direction: column; gap: 10px; position: relative;\">\n      <img src=\"efc5bc41-7348-4d3b-99e3-8dde7248b1c8\" alt=\"\" style=\"position: absolute; right: -30px; bottom: -30px; width: 250px; opacity: 0.12; pointer-events: none;\">\n      <div style=\"position: relative; font: 500 12px Poppins, sans-serif; letter-spacing: 0.16em; color: rgba(255,255,255,0.5);\">Access<\u002Fdiv>\n      <sc-raw-select value=\"{{ role }}\" sc-camel-on-change=\"{{ onRole }}\" style=\"position: relative; width: 100%; padding: 11px 12px; background: #1a1a1a; color: #ffffff; border: 1px solid rgba(255,255,255,0.18); font: 600 14px Poppins, sans-serif;\">\n        <sc-for list=\"{{ roles }}\" as=\"r\" hint-placeholder-count=\"3\">\n          <option value=\"{{ r }}\">{{ r }}<\u002Foption>\n        <\u002Fsc-for>\n      <\u002Fsc-raw-select>\n      <div style=\"position: relative; font: 400 12px Poppins, sans-serif; color: rgba(255,255,255,0.55); line-height: 1.5;\">{{ roleNote }}<\u002Fdiv>\n      <button type=\"button\" sc-camel-on-click=\"{{ onReset }}\" style=\"position: relative; margin-top: 8px; padding: 10px; background: transparent; color: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.18); font: 500 12px Poppins, sans-serif; cursor: pointer;\">Clear all applications<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <main style=\"flex: 1; min-width: 0; display: flex; flex-direction: column;\">\n\n    <header style=\"background: #0d0d0d; color: #ffffff; position: relative; overflow: hidden; border-bottom: 3px solid #FAD028;\">\n      <img src=\"efc5bc41-7348-4d3b-99e3-8dde7248b1c8\" alt=\"\" style=\"position: absolute; left: -40px; top: -30px; width: 250px; opacity: 0.1; pointer-events: none;\">\n      <div style=\"position: relative; padding: 24px 30px 18px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap;\">\n        <div style=\"min-width: 0; display: flex; gap: 14px; align-items: stretch;\">\n          <div style=\"width: 8px; min-height: 52px; background: #FAD028; transform: skewX(-14deg);\"><\u002Fdiv>\n          <div>\n            <div style=\"font: 500 12px Poppins, sans-serif; letter-spacing: 0.14em; color: rgba(255,255,255,0.6);\">{{ viewEn }}<\u002Fdiv>\n            <div style=\"font: 700 26px Poppins, sans-serif; margin-top: 3px;\">{{ viewTitle }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: 1;\"><\u002Fdiv>\n        <input value=\"{{ q }}\" sc-camel-on-input=\"{{ onSearch }}\" placeholder=\"Search by name, email, role, skills…\" style=\"width: 340px; max-width: 46vw; padding: 12px 14px; border: 1px solid rgba(255,255,255,0.22); background: #1a1a1a; color: #ffffff; font: 400 14px Poppins, sans-serif;\">\n        <button type=\"button\" sc-camel-on-click=\"{{ onExport }}\" style=\"padding: 13px 20px; background: transparent; color: #ffffff; border: 1px solid rgba(255,255,255,0.32); font: 600 14px Poppins, sans-serif; cursor: pointer;\">Export CSV<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ goNew }}\" style=\"padding: 13px 20px; background: #FAD028; color: #0d0d0d; border: none; font: 700 14px Poppins, sans-serif; cursor: pointer;\">+ New applicant<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"position: relative; display: flex; gap: 4px; padding: 0 22px; border-top: 1px solid rgba(255,255,255,0.12); flex-wrap: wrap;\">\n        <sc-for list=\"{{ tabs }}\" as=\"tb\" hint-placeholder-count=\"6\">\n          <button type=\"button\" sc-camel-on-click=\"{{ tb.go }}\" style=\"{{ tb.style }}\">\n            <span>{{ tb.label }}<\u002Fspan>\n            <span style=\"{{ tb.countStyle }}\">{{ tb.n }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <div key=\"{{ viewKey }}\" style=\"padding: 26px 30px 44px; display: flex; flex-direction: column; gap: 22px; animation: hl-rise .42s cubic-bezier(.2,.7,.3,1) both;\">\n\n      <!-- dashboard -->\n      <sc-if value=\"{{ isDash }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px;\">\n          <sc-for list=\"{{ cards }}\" as=\"c\" hint-placeholder-count=\"4\">\n            <div data-glow=\"\" style=\"{{ c.cardStyle }}\">\n              <div style=\"position: absolute; top: -14px; left: -26px; width: 58px; height: 74px; background: #0d0d0d; opacity: 0.12; transform: skewX(-14deg);\"><\u002Fdiv>\n              <div style=\"font: 500 12px Poppins, sans-serif; letter-spacing: 0.16em; color: rgba(13,13,13,0.62);\">{{ c.en }}<\u002Fdiv>\n              <div style=\"display: flex; align-items: baseline; gap: 10px; margin-top: 10px;\">\n                <div style=\"font: 700 44px Poppins, sans-serif; font-variant-numeric: tabular-nums;\">{{ c.value }}<\u002Fdiv>\n                <div style=\"font: 600 15px Poppins, sans-serif; color: rgba(13,13,13,0.7);\">{{ c.label }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"height: 4px; background: rgba(13,13,13,0.16); margin-top: 14px;\">\n                <div style=\"{{ c.barStyle }}\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 20px;\">\n          <div style=\"background: #141414; border: 1px solid rgba(250,208,40,0.30);\">\n            <div style=\"padding: 18px 22px; background: #0d0d0d; color: #FAD028; border-bottom: 3px solid #FAD028; font: 700 17px Poppins, sans-serif;\">Candidates by stage<\u002Fdiv>\n            <sc-for list=\"{{ byStage }}\" as=\"f\" hint-placeholder-count=\"7\">\n              <div style=\"display: flex; align-items: center; gap: 16px; padding: 14px 22px; border-bottom: 1px solid rgba(255,255,255,0.10);\">\n                <div style=\"width: 150px; flex: 0 0 150px; font: 600 15px Poppins, sans-serif;\">{{ f.label }}<\u002Fdiv>\n                <div style=\"flex: 1; height: 22px; background: rgba(255,255,255,0.14); min-width: 0; overflow: hidden;\">\n                  <div style=\"{{ f.barStyle }}\"><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"width: 54px; text-align: left; font: 700 16px Poppins, sans-serif; font-variant-numeric: tabular-nums;\">{{ f.count }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"background: #141414; border: 1px solid rgba(250,208,40,0.30);\">\n            <div style=\"padding: 18px 22px; background: #0d0d0d; color: #FAD028; border-bottom: 3px solid #FAD028; font: 700 17px Poppins, sans-serif;\">Roles · applicant count<\u002Fdiv>\n            <sc-for list=\"{{ byPosition }}\" as=\"p\" hint-placeholder-count=\"6\">\n              <div style=\"display: flex; align-items: center; gap: 16px; padding: 14px 22px; border-bottom: 1px solid rgba(255,255,255,0.10);\">\n                <div style=\"flex: 1; min-width: 0;\">\n                  <div style=\"font: 600 15px Poppins, sans-serif;\">{{ p.label }}<\u002Fdiv>\n                  <div style=\"font: 400 13px Poppins, sans-serif; color: rgba(255,255,255,0.6); margin-top: 2px;\">{{ p.split }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font: 700 18px Poppins, sans-serif; font-variant-numeric: tabular-nums; color: #FAD028;\">{{ p.count }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- applicants list -->\n      <sc-if value=\"{{ isList }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background: #FAD028; padding: 18px 22px; display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end;\">\n          <label style=\"display: flex; flex-direction: column; gap: 6px;\">\n            <span style=\"font: 500 12px Poppins, sans-serif; letter-spacing: 0.14em; color: rgba(13,13,13,0.72);\">Stage<\u002Fspan>\n            <sc-raw-select value=\"{{ fStage }}\" sc-camel-on-change=\"{{ onFStage }}\" style=\"padding: 11px 12px; border: 1px solid #0d0d0d; background: #141414; color: #ffffff; font: 400 14px Poppins, sans-serif; min-width: 170px;\">\n              <sc-for list=\"{{ stageOptions }}\" as=\"x\" hint-placeholder-count=\"8\">\n                <option value=\"{{ x }}\">{{ x }}<\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Flabel>\n          <label style=\"display: flex; flex-direction: column; gap: 6px;\">\n            <span style=\"font: 500 12px Poppins, sans-serif; letter-spacing: 0.14em; color: rgba(13,13,13,0.72);\">Type<\u002Fspan>\n            <sc-raw-select value=\"{{ fType }}\" sc-camel-on-change=\"{{ onFType }}\" style=\"padding: 11px 12px; border: 1px solid #0d0d0d; background: #141414; color: #ffffff; font: 400 14px Poppins, sans-serif; min-width: 150px;\">\n              <sc-for list=\"{{ typeOptions }}\" as=\"x\" hint-placeholder-count=\"3\">\n                <option value=\"{{ x }}\">{{ x }}<\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Flabel>\n          <label style=\"display: flex; flex-direction: column; gap: 6px;\">\n            <span style=\"font: 500 12px Poppins, sans-serif; letter-spacing: 0.14em; color: rgba(13,13,13,0.72);\">Role<\u002Fspan>\n            <sc-raw-select value=\"{{ fPos }}\" sc-camel-on-change=\"{{ onFPos }}\" style=\"padding: 11px 12px; border: 1px solid #0d0d0d; background: #141414; color: #ffffff; font: 400 14px Poppins, sans-serif; min-width: 200px;\">\n              <sc-for list=\"{{ posOptions }}\" as=\"x\" hint-placeholder-count=\"7\">\n                <option value=\"{{ x }}\">{{ x }}<\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Flabel>\n          <label style=\"display: flex; flex-direction: column; gap: 6px;\">\n            <span style=\"font: 500 12px Poppins, sans-serif; letter-spacing: 0.14em; color: rgba(13,13,13,0.72);\">Source<\u002Fspan>\n            <sc-raw-select value=\"{{ fSource }}\" sc-camel-on-change=\"{{ onFSource }}\" style=\"padding: 11px 12px; border: 1px solid #0d0d0d; background: #141414; color: #ffffff; font: 400 14px Poppins, sans-serif; min-width: 160px;\">\n              <sc-for list=\"{{ sourceOptions }}\" as=\"x\" hint-placeholder-count=\"5\">\n                <option value=\"{{ x }}\">{{ x }}<\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Flabel>\n\n          <div style=\"flex: 1 1 100%; height: 1px; background: rgba(13,13,13,0.28); margin: 4px 0;\"><\u002Fdiv>\n\n          <label style=\"display: flex; flex-direction: column; gap: 6px;\">\n            <span style=\"font: 500 12px Poppins, sans-serif; letter-spacing: 0.14em; color: rgba(13,13,13,0.72);\">From<\u002Fspan>\n            <input type=\"date\" value=\"{{ from }}\" sc-camel-on-input=\"{{ onFrom }}\" style=\"padding: 10px 12px; border: 1px solid #0d0d0d; background: #141414; color: #ffffff; font: 500 14px Poppins, sans-serif;\">\n          <\u002Flabel>\n          <label style=\"display: flex; flex-direction: column; gap: 6px;\">\n            <span style=\"font: 500 12px Poppins, sans-serif; letter-spacing: 0.14em; color: rgba(13,13,13,0.72);\">To<\u002Fspan>\n            <input type=\"date\" value=\"{{ to }}\" sc-camel-on-input=\"{{ onTo }}\" style=\"padding: 10px 12px; border: 1px solid #0d0d0d; background: #141414; color: #ffffff; font: 500 14px Poppins, sans-serif;\">\n          <\u002Flabel>\n          <div style=\"display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap;\">\n            <sc-for list=\"{{ quickRanges }}\" as=\"r\" hint-placeholder-count=\"4\">\n              <button type=\"button\" sc-camel-on-click=\"{{ r.go }}\" style=\"{{ r.style }}\">{{ r.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"flex: 1;\"><\u002Fdiv>\n          <div style=\"font: 600 14px Poppins, sans-serif; color: rgba(13,13,13,0.78);\">{{ summary }}<\u002Fdiv>\n          <sc-if value=\"{{ filtersActive }}\" hint-placeholder-val=\"{{ false }}\">\n            <button type=\"button\" sc-camel-on-click=\"{{ onResetFilters }}\" style=\"padding: 11px 18px; background: #0d0d0d; color: #ffffff; border: none; font: 600 13px Poppins, sans-serif; cursor: pointer;\">Clear filters<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"background: #141414; border: 1px solid rgba(250,208,40,0.30); overflow-x: auto;\">\n          <div style=\"display: flex; flex-wrap: nowrap; gap: 14px; padding: 14px 22px; min-width: 1180px; background: #0d0d0d; border-bottom: 3px solid #FAD028; font: 600 12px Poppins, sans-serif; letter-spacing: 0.14em; color: #FAD028; white-space: nowrap;\">\n            <div style=\"width: 96px; flex: 0 0 96px;\">TIMESTAMP<\u002Fdiv>\n            <div style=\"width: 180px; flex: 0 0 180px;\">NAME<\u002Fdiv>\n            <div style=\"width: 210px; flex: 0 0 210px;\">EMAIL · PHONE<\u002Fdiv>\n            <div style=\"width: 170px; flex: 0 0 170px;\">POSITION<\u002Fdiv>\n            <div style=\"width: 84px; flex: 0 0 84px;\">TYPE<\u002Fdiv>\n            <div style=\"width: 240px; flex: 0 0 240px;\">LINKEDIN · CV · PORTFOLIO<\u002Fdiv>\n            <div style=\"flex: 1 1 320px; min-width: 320px;\">CANDIDAT an>\n                <a href=\"{{ r.portfolio }}\" target=\"_blank\" rel=\"noopener\">Portfolio<\u002Fa>\n              <\u002Fdiv>\n              <div style=\"flex: 1 1 320px; min-width: 320px; font: 400 14px Poppins, sans-serif; color: rgba(255,255,255,0.85); overflow: hidden; text-overflow: ellipsis;\" title=\"{{ r.fullMessage }}\">{{ r.message }}<\u002Fdiv>\n              <div style=\"width: 150px; flex: 0 0 150px; overflow: hidden;\">\n                <span style=\"{{ r.badgeStyle }}\">{{ r.stage }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"width: 60px; flex: 0 0 60px; font: 700 16px Poppins, sans-serif; font-variant-numeric: tabular-nums; color: {{ r.scoreColor }};\">{{ r.score }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ noRows }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding: 40px 22px; text-align: center; font: 400 15px Poppins, sans-serif; color: rgba(255,255,255,0.66);\">No results match these filters.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- Candidate file -->\n      <sc-if value=\"{{ isCand }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start;\">\n\n          <div style=\"flex: 3 1 520px; display: flex; flex-direction: column; gap: 20px; min-width: 0;\">\n            <div style=\"background: #141414; border: 1px solid rgba(250,208,40,0.30); padding: 24px;\">\n              <div style=\"display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap;\">\n                <div style=\"width: 8px; align-self: stretch; min-height: 60px; background: #FAD028; transform: skewX(-14deg);\"><\u002Fdiv>\n                <div style=\"min-width: 0;\">\n                  <div style=\"font: 500 12px Poppins, sans-serif; letter-spacing: 0.16em; color: rgba(255,255,255,0.66);\">APPLICATION · {{ c.code }}<\u002Fdiv>\n                  <div style=\"font: 700 30px Poppins, sans-serif; margin-top: 6px;\">{{ c.name }}<\u002Fdiv>\n                  <div style=\"font: 400 15px Poppins, sans-serif; color: rgba(255,255,255,0.66); margin-top: 4px;\">{{ c.meta }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"flex: 1;\"><\u002Fdiv>\n                <div style=\"text-align: left;\">\n                  <div style=\"font: 700 40px Poppins, sans-serif; font-variant-numeric: tabular-nums; line-height: 1; color: #FAD028;\">{{ c.score }}<\u002Fdiv>\n                  <div style=\"font: 500 12px Poppins, sans-serif; letter-spacing: 0.14em; color: rgba(255,255,255,0.66); margin-top: 4px;\">SCORE / 100<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"display: flex; flex-wrap: wrap; gap: 6px; margin: 22px 0 10px;\">\n                <sc-for list=\"{{ c.steps }}\" as=\"s\" hint-placeholder-count=\"7\">\n                  <div style=\"{{ s.style }}\" title=\"{{ s.test }}\">\n                    <div style=\"font: 600 12px Poppins, sans-serif; line-height: 1.35;\">{{ s.label }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n\n              <div style=\"border: 1px solid rgba(250,208,40,0.30); background: rgba(250,208,40,0.12); padding: 16px 18px; margin-top: 16px;\">\n                <div style=\"font: 500 12px Poppins, sans-serif; letter-spacing: 0.16em; color: #FAD028;\">What moves this to the next stage<\u002Fdiv>\n                <div style=\"font: 600 16px Poppins, sans-serif; margin-top: 8px; line-height: 1.5;\">{{ c.exitTest }}<\u002Fdiv>\n                <div style=\"display: flex; gap: 12px; align-items: center; margin-top: 14px; flex-wrap: wrap;\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ onAdvance }}\" style=\"{{ advanceStyle }}\">{{ advanceLabel }}<\u002Fbutton>\n                  <sc-raw-select value=\"{{ rejectReason }}\" sc-camel-on-change=\"{{ onRejectReason }}\" style=\"padding: 11px 12px; border: 1px solid rgba(255,255,255,0.28); background: #141414; color: #ffffff; font: 400 14px Poppins, sans-serif;\">\n                    <sc-for list=\"{{ rejectReasons }}\" as=\"r\" hint-placeholder-count=\"6\">\n                      <option value=\"{{ r }}\">{{ r }}<\u002Foption>\n                    <\u002Fsc-for>\n                  <\u002Fsc-raw-select>\n                  <button type=\"button\" sc-camel-on-click=\"{{ onReject }}\" style=\"padding: 11px 18px; background: transparent; color: #ffffff; border: 1px solid rgba(255,255,255,0.32); font: 600 14px Poppins, sans-serif; cursor: pointer;\">Reject<\u002Fbutton>\n                  <div style=\"font: 600 13px Poppins, sans-serif; color: #ff7a7a;\">{{ rejectError }}<\u002Fdiv>\n                <\u002Fdiv>\n                <sc-if value=\"{{ isRejected }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"margin-top: 14px; border: 1px solid #ff7a7a; background: rgba(255,122,122,0.12); padding: 14px 16px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap;\">\n                    <div style=\"flex: 1; min-width: 220px; font: 600 15px Poppins, sans-serif; color: #ff7a7a; line-height: 1.5;\">{{ rejectBanner }}<\u002Fdiv>\n                    <button type=\"button\" sc-camel-on-click=\"{{ onRestore }}\" style=\"padding: 11px 18px; background: #FAD028; color: #0d0d0d; border: none; font: 600 14px Poppins, sans-serif; cursor: pointer;\">Put back in process<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background: #141414; border: 1px solid rgba(250,208,40,0.30); padding: 24px;\">\n              <div style=\"display: flex; align-items: center; gap: 12px; flex-wrap: wrap;\">\n                <div style=\"font: 700 18px Poppins, sans-serif;\">Evaluation<\u002Fdiv>\n                <div style=\"font: 500 12px Poppins, sans-serif; letter-spacing: 0.16em; color: #FAD028;\">EVALUATION<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px; margin-top: 18px;\">\n                <sc-for list=\"{{ c.scores }}\" as=\"sc\" hint-placeholder-count=\"4\">\n                  <div>\n                    <div style=\"display: flex; justify-content: space-between; align-items: baseline;\">\n                      <span style=\"font: 600 14px Poppins, sans-serif;\">{{ sc.label }}<\u002Fspan>\n                      <span style=\"font: 700 16px Poppins, sans-serif; font-variant-numeric: tabular-nums; color: #FAD028;\">{{ sc.value }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <input type=\"range\" min=\"0\" max=\"10\" step=\"1\" value=\"{{ sc.value }}\" sc-camel-on-input=\"{{ sc.onInput }}\" style=\"width: 100%; margin-top: 8px; accent-color: #FAD028; background: transparent;\">\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background: #141414; border: 1px solid rgba(250,208,40,0.30); padding: 24px;\">\n              <div style=\"display: flex; align-items: center; gap: 12px; flex-wrap: wrap;\">\n                <div style=\"font: 700 18px Poppins, sans-serif;\">Activity log<\u002Fdiv>\n                <div style=\"font: 500 12px Poppins, sans-serif; letter-spacing: 0.16em; color: #FAD028;\">Activity log · manual entry<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; align-items: stretch;\">\n                <sc-raw-select value=\"{{ logType }}\" sc-camel-on-change=\"{{ onLogType }}\" style=\"padding: 12px; border: 1px solid rgba(255,255,255,0.24); background: #141414; color: #ffffff; font: 400 14px Poppins, sans-serif; min-width: 160px;\">\n                  <sc-for list=\"{{ logTypes }}\" as=\"t\" hint-placeholder-count=\"6\">\n                    <option value=\"{{ t }}\">{{ t }}<\u002Foption>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-select>\n                <input value=\"{{ logText }}\" sc-camel-on-input=\"{{ onLogText }}\" placeholder=\"Write the interview or task outcome in full\" style=\"flex: 1; min-width: 240px; padding: 12px 14px; border: 1px solid rgba(255,255,255,0.24); background: #141414; color: #ffffff; font: 400 14px Poppins, sans-serif;\">\n                <button type=\"button\" sc-camel-on-click=\"{{ onAddLog }}\" style=\"padding: 12px 20px; background: #FAD028; color: #0d0d0d; border: none; font: 700 14px Poppins, sans-serif; cursor: pointer;\">Log it<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"margin-top: 20px; display: flex; flex-direction: column;\">\n                <sc-for list=\"{{ c.log }}\" as=\"l\" hint-placeholder-count=\"5\">\n                  <div style=\"display: flex; gap: 14px; padding: 14px 0; border-top: 1px solid rgba(255,255,255,0.10);\">\n                    <div style=\"{{ l.dotStyle }}\"><\u002Fdiv>\n                    <div style=\"flex: 1; min-width: 0; overflow-wrap: anywhere;\">\n                      <div style=\"font: 400 15px Poppins, sans-serif; line-height: 1.5;\">{{ l.text }}<\u002Fdiv>\n                      <div style=\"display: flex; gap: 12px; margin-top: 5px; font: 500 11px Poppins, sans-serif; letter-spacing: 0.1em; color: rgba(255,255,255,0.66);\">\n                        <span>{{ l.type }}<\u002Fspan>\n                        <span>{{ l.at }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"flex: 2 1 340px; display: flex; flex-direction: column; gap: 20px; min-width: 0;\">\n            <div style=\"background: #141414; border: 1px solid rgba(250,208,40,0.30); padding: 22px;\">\n              <div style=\"font: 500 12px Poppins, sans-serif; letter-spacing: 0.16em; color: rgba(255,255,255,0.66);\">Candidate record<\u002Fdiv>\n              <div style=\"margin-top: 14px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px;\">\n                <sc-for list=\"{{ c.fields }}\" as=\"f\" hint-placeholder-count=\"8\">\n                  <label style=\"display: flex; flex-direction: column; gap: 6px; min-width: 0;\">\n                    <span style=\"font: 600 13px Poppins, sans-serif; color: rgba(255,255,255,0.66);\">{{ f.label }}<\u002Fspan>\n                    <input value=\"{{ f.value }}\" sc-camel-on-input=\"{{ f.onInput }}\" style=\"width: 100%; min-width: 0; padding: 10px 12px; border: 1px solid rgba(255,255,255,0.18); background: #141414; color: #ffffff; font: 400 14px Poppins, sans-serif;\">\n                  <\u002Flabel>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background: #141414; border: 1px solid rgba(250,208,40,0.30); padding: 22px;\">\n              <div style=\"font: 500 12px Poppins, sans-serif; letter-spacing: 0.16em; color: rgba(255,255,255,0.66);\">Candidate message<\u002Fdiv>\n              <div style=\"font: 400 15px Poppins, sans-serif; line-height: 1.7; margin-top: 12px; overflow-wrap: anywhere;\">{{ c.message }}<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background: #141414; border: 1px solid rgba(250,208,40,0.30); padding: 22px;\">\n              <div style=\"font: 500 12px Poppins, sans-serif; letter-spacing: 0.16em; color: rgba(255,255,255,0.66);\">Links and files<\u002Fdiv>\n              <div style=\"margin-top: 14px; display: flex; flex-direction: column; gap: 10px;\">\n                <sc-for list=\"{{ c.links }}\" as=\"l\" hint-placeholder-count=\"3\">\n                  <div style=\"display: flex; gap: 10px; align-items: center; border: 1px solid rgba(255,255,255,0.14); padding: 10px 12px;\">\n                    <div style=\"width: 8px; height: 8px; background: #FAD028;\"><\u002Fdiv>\n                    <div style=\"flex: 1; min-width: 0; font: 400 14px Poppins, sans-serif;\">{{ l.label }}<\u002Fdiv>\n                    <a href=\"{{ l.href }}\" target=\"_blank\" rel=\"noopener\" style=\"font: 600 13px Poppins, sans-serif;\">{{ l.action }}<\u002Fa>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display: flex; gap: 8px; margin-top: 14px;\">\n                <input value=\"{{ fileName }}\" sc-camel-on-input=\"{{ onFileName }}\" placeholder=\"Attachment name — task, portfolio, certificate…\" style=\"flex: 1; min-width: 0; padding: 11px 12px; border: 1px solid rgba(255,255,255,0.24); background: #141414; color: #ffffff; font: 400 14px Poppins, sans-serif;\">\n                <button type=\"button\" sc-camel-on-click=\"{{ onAddFile }}\" style=\"padding: 11px 16px; background: #FAD028; color: #0d0d0d; border: none; font: 600 13px Poppins, sans-serif; cursor: pointer;\">Add<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background: #FAD028; color: #0d0d0d; padding: 22px;\">\n              <div style=\"font: 500 12px Poppins, sans-serif; letter-spacing: 0.16em; color: rgba(13,13,13,0.62);\">Next step<\u002Fdiv>\n              <input value=\"{{ c.nextStep }}\" sc-camel-on-input=\"{{ onNextStep }}\" style=\"width: 100%; margin-top: 12px; padding: 11px 12px; background: #ffffff; color: #0d0d0d; border: 1px solid #0d0d0d; font: 400 14px Poppins, sans-serif;\">\n              <input value=\"{{ c.nextDate }}\" sc-camel-on-input=\"{{ onNextDate }}\" placeholder=\"YYYY-MM-DD\" style=\"width: 100%; margin-top: 8px; padding: 11px 12px; background: #ffffff; color: #0d0d0d; border: 1px solid #0d0d0d; font: 500 14px Poppins, sans-serif;\">\n              <div style=\"font: 400 13px Poppins, sans-serif; color: rgba(13,13,13,0.72); margin-top: 10px; line-height: 1.5;\">Every applicant gets an answer — including the rejected ones.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- New applicant -->\n      <sc-if value=\"{{ isNew }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position: relative; overflow: hidden; background: #0d0d0d; border: 1px solid rgba(250,208,40,0.30); padding: 54px 44px 48px;\">\n          <img src=\"efc5bc41-7348-4d3b-99e3-8dde7248b1c8\" alt=\"\" style=\"position: absolute; left: -110px; top: -90px; width: 520px; opacity: 0.12; pointer-events: none; animation: hl-drift 11s ease-in-out infinite alternate;\">\n          <img src=\"efc5bc41-7348-4d3b-99e3-8dde7248b1c8\" alt=\"\" style=\"position: absolute; right: -140px; bottom: -120px; width: 460px; opacity: 0.08; pointer-events: none; animation: hl-drift 14s ease-in-out infinite alternate-reverse;\">\n          <div style=\"position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 14px;\">\n            <div style=\"display: flex; align-items: center; gap: 16px;\">\n              <img src=\"604992ea-fd51-465d-abf6-8af00d89efc9\" alt=\"Helal\" style=\"height: 56px; width: auto;\">\n              <div style=\"font: 600 26px Poppins, sans-serif; letter-spacing: 0.01em; line-height: 1; white-space: nowrap;\">\n                <span style=\"color: #ffffff;\">Helal<\u002Fspan> <span style=\"color: #FAD028;\">Content Marketing<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font: 500 18px Poppins, sans-serif; letter-spacing: 0.14em; color: rgba(255,255,255,0.55);\">ALEXANDRIA · EGYPT<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"position: relative; width: 72px; height: 4px; background: #FAD028; margin: 36px 0 22px;\"><\u002Fdiv>\n\n          <div style=\"position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 16px;\">\n            <div style=\"font: 700 clamp(36px, 4.6vw, 54px) Poppins, sans-serif; line-height: 1.1; letter-spacing: -0.01em; max-width: 720px; text-wrap: pretty;\">Work with <span style=\"color: #FAD028;\">Helal<\u002Fspan><\u002Fdiv>\n            <div style=\"font: 400 18px Poppins, sans-serif; color: rgba(255,255,255,0.72); max-width: 620px; line-height: 1.6;\">Jobs and internships in content and marketing.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background: #141414; border: 1px solid rgba(250,208,40,0.30); border-top: 4px solid #FAD028; padding: 30px;\">\n          <div style=\"font: 700 22px Poppins, sans-serif;\">Application form<\u002Fdiv>\n          <div style=\"font: 400 15px Poppins, sans-serif; color: rgba(255,255,255,0.66); margin-top: 6px;\">Name, email and role are required — the source tells us which channel brings the best people.<\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 26px;\">\n            <sc-for list=\"{{ newFields }}\" as=\"f\" hint-placeholder-count=\"7\">\n              <label style=\"display: flex; flex-direction: column; gap: 7px;\">\n                <span style=\"font: 600 13px Poppins, sans-serif; letter-spacing: 0.06em; color: #FAD028;\">{{ f.label }}<\u002Fspan>\n                <input value=\"{{ f.value }}\" sc-camel-on-input=\"{{ f.onInput }}\" placeholder=\"{{ f.placeholder }}\" style=\"{{ f.inputStyle }}\">\n                <span style=\"font: 400 12px Poppins, sans-serif; color: #ff7a7a;\">{{ f.hint }}<\u002Fspan>\n              <\u002Flabel>\n            <\u002Fsc-for>\n            <sc-for list=\"{{ newSelects }}\" as=\"f\" hint-placeholder-count=\"3\">\n              <label style=\"display: flex; flex-direction: column; gap: 7px;\">\n                <span style=\"font: 600 13px Poppins, sans-serif; letter-spacing: 0.06em; color: #FAD028;\">{{ f.label }}<\u002Fspan>\n                <sc-raw-select value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\" riting with a reply date.' },\n  { label: 'Hired', en: 'HIRED', test: 'Contract signed and the start date set.' },\n];\nconst POSITIONS = ['Graphic designer', 'Motion designer', 'Video editor', 'Photographer', 'Content creator', 'Copywriter', 'Social media specialist', 'Media buyer', 'Performance marketer', 'Account manager', 'Sales representative', 'UI/UX designer', 'Web developer', 'Data & reporting', 'Other role'];\nconst TYPES = ['Job', 'Internship'];\nconst LEVELS = ['Entry level', 'Mid level', 'Senior'];\nconst SOURCES = ['Website', 'Instagram', 'LinkedIn', 'Employee referral', 'University', 'Career fair'];\nconst LOG_TYPES = ['Note', 'Call', 'Email', 'Interview', 'Practical task', 'Decision'];\nconst REJECT_REASONS = ['Less experience than required', 'Portfolio not a fit', 'Salary expectation too high', 'Location / availability', 'Did not submit the task', 'Took another offer'];\nconst ROLES = ['HR', 'Department head', 'Management'];\nconst ROLE_NOTES = {\n  'HR': 'Full access: log applicants, move stages, reject, edit records.',\n  'Department head': 'Score candidates and write interview outcomes — no edits to core records.',\n  'Management': 'Read only: numbers, lists and files.',\n};\nconst SCORE_KEYS = [['Skill', 'skill'], ['Portfolio', 'portfolio'], ['Communication', 'comm'], ['Culture fit', 'fit']];\n\nfunction today() { return new Date('2026-09-21T09:00:00'); }\nfunction iso(d) { return d.toISOString().slice(0, 10); }\nfunction addDays(n) { const d = today(); d.setDate(d.getDate() + n); return iso(d); }\n\nfunction seed() {\n  return [];\n}\n\nconst SCHEMA = [\n  { table: 'candidates', ar: 'Candidates', cols: [\n    { name: 'id', type: 'uuid pk' }, { name: 'full_name', type: 'text' }, { name: 'email', type: 'text uniq' },\n    { name: 'phone', type: 'text' }, { name: 'city', type: 'text' }, { name: 'years_experience', type: 'int' },\n    { name: 'linkedin_url', type: 'text' }, { name: 'created_at', type: 'timestamptz' }] },\n  { table: 'applications', owerCase();\n      return hay.indexOf(q) >= 0;\n    });\n  }\n\n  renderVals() {\n    const self = this, s = this.state;\n    const apps = this.state.apps;\n    const live = apps.filter(function (a) { return !a.rejected; });\n    const rejected = apps.filter(function (a) { return !!a.rejected; });\n    const list = this.filtered();\n    const sel = s.sel ? apps.filter(function (a) { return a.id === s.sel; })[0] : null;\n    const canEdit = s.role === 'HR';\n\n    const navDefs = [\n      { key: 'dash', label: 'Dashboard', en: 'DASHBOARD', count: '' },\n      { key: 'list', label: 'Candidates', en: 'APPLICANTS', count: live.length },\n      { key: 'new', label: 'New applicant', en: 'NEW', count: '' },\n      { key: 'schema', label: 'Database', en: 'SCHEMA', count: SCHEMA.length },\n    ];\n    const nav = navDefs.filter(function (n) { return canEdit || n.key !== 'new'; }).map(function (n) {\n      const on = s.view === n.key || (n.key === 'list' && s.view === 'cand');\n      return Object.assign({}, n, {\n        go: function () { self.setState({ view: n.key, sel: null }); },\n        style: 'display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; text-align: left; padding: 13px 14px; cursor: pointer; border: none; border-left: 3px solid ' +\n          (on ? '#FAD028' : 'transparent') + '; background: ' + (on ? '#1c1c1c' : 'transparent') + '; color: ' + (on ? '#ffffff' : 'rgba(255,255,255,0.72)') + ';',\n      });\n    });\n\n    const titles = {\n      dash: ['Dashboard', 'DASHBOARD · overview'], list: ['Candidates', 'APPLICANTS · all applications'],\n      cand: ['Candidate file', 'CANDIDATE FILE'], new: ['New applicant', 'NEW APPLICATION'],\n      schema: ['Database', 'DATABASE SCHEMA'],\n    };\n    const t = titles[s.view] || titles.dash;\n\n    const tabs = [\n      { key: 'all', label: 'All', n: live.length },\n      { key: 'active', label: 'In process', n: live.filter(function (a) { return a.stage > 0 && a.stage < 6; }).len
